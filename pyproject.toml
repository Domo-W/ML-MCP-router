[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-mcp-router"
version = "0.1.0"
description = "Cursor MCP sidecar: route a researcher intent to one W&B, Hugging Face, or arXiv tool."
readme = "src/ml_router/README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "jsonschema>=4.20",
    "httpx>=0.27",
]

[project.scripts]
ml-router = "ml_router.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ml_router = ["data/catalog.v1.json"]
